openapi: 3.1.0
info:
  title: Vektra API
  version: 1.1.0
  description:
    Contrato público de Vektra. Toda mutación valida rol, alcance, CSRF cuando usa cookies
    y reglas de negocio en PostgreSQL. Una cuenta con contraseña temporal sólo puede consultar
    /auth/sesion o llamar /auth/cambiar-contrasena; las demás rutas responden 428
    CAMBIO_CONTRASENA_REQUERIDO.
  license:
    name: Propietaria; consulte LICENSE.md
    identifier: LicenseRef-Nexo-Proprietary
servers:
  - url: https://nexo.deadcode.cloud/api
    description: Producción (Nginx traduce a /api/v1)
  - url: http://localhost:4000/api/v1
    description: Desarrollo local
security:
  - cookieSesion: []
  - bearerMovil: []
tags:
  - name: Autenticación
    description: Inicio, renovación, cierre, contraseña y MFA.
  - name: Usuarios
    description: Administración de cuentas, roles y credenciales.
  - name: Clientes
    description: Directorio, expediente, saldo y cartera.
  - name: Localidades
    description: Catálogo territorial para clientes y rutas.
  - name: Rutas
    description: Planeación y ejecución de cobranza por localidad.
  - name: Ventas
    description: Ventas de contado, crédito y público general.
  - name: Abonos
    description: Cobros, aplicación a cuotas y anulaciones auditadas.
  - name: Inventario
    description: Productos, fotografías, existencias y movimientos.
  - name: Compras
    description: Entradas de mercancía y facturas de proveedor.
  - name: Proveedores
    description: Directorio completo y opciones minimizadas por rol.
  - name: Pedidos
    description: Solicitud, surtido, almacén y entrega al cliente.
  - name: Devoluciones
    description: Devolución, evidencia, autorización y reembolso.
  - name: Cortes
    description: Previsualización y cierre firmado de caja.
  - name: Sincronización
    description: Bitácora offline, dispositivos, lotes y revisiones.
  - name: Reportes
    description: Balances, Excel y documentos operativos.
  - name: Alertas
    description: Señales empresariales que requieren atención.
  - name: Auditoría
    description: Historial inmutable de acciones sensibles.
  - name: Importaciones
    description: Carga transaccional inicial mediante Excel.
  - name: Reconciliación
    description: Comparación de libros contra proyecciones.
paths:
  /auth/iniciar-sesion:
    post:
      tags:
        - Autenticación
      security: []
      summary: Inicia sesión web o móvil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InicioSesion"
      responses:
        "200":
          $ref: "#/components/responses/Exito"
        "401":
          $ref: "#/components/responses/Error"
        "423":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
      operationId: postAuthIniciarSesion
  /auth/renovar:
    post:
      tags:
        - Autenticación
      summary: Consume una sola vez el refresh token y rota la sesión
      description:
        Web usa cookie+CSRF; móvil envía refreshToken. Renovaciones concurrentes sólo permiten
        una sucesora.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/Exito"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
      operationId: postAuthRenovar
  /auth/cerrar-sesion:
    post:
      tags:
        - Autenticación
      summary: Revoca la sesión
      responses:
        "204":
          description: Sesión cerrada
        4XX:
          $ref: "#/components/responses/Error"
      operationId: postAuthCerrarSesion
  /auth/sesion:
    get:
      tags:
        - Autenticación
      summary: Devuelve la identidad actual
      responses:
        "200":
          $ref: "#/components/responses/Exito"
        4XX:
          $ref: "#/components/responses/Error"
      operationId: getAuthSesion
  /auth/cambiar-contrasena:
    post:
      tags:
        - Autenticación
      summary: Cambia contraseña propia y revoca sesiones
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contrasenaActual
                - nuevaContrasena
              properties:
                contrasenaActual:
                  type: string
                nuevaContrasena:
                  type: string
                  minLength: 6
      responses:
        "204":
          description: Contraseña cambiada
        "422":
          $ref: "#/components/responses/Error"
      operationId: postAuthCambiarContrasena
  /auth/mfa/iniciar:
    post:
      tags:
        - Autenticación
      x-roles:
        - ADMINISTRADOR
      summary: Genera secreto MFA temporal
      responses:
        "200":
          $ref: "#/components/responses/Exito"
        "403":
          $ref: "#/components/responses/Error"
      operationId: postAuthMfaIniciar
  /auth/mfa/confirmar:
    post:
      tags:
        - Autenticación
      x-roles:
        - ADMINISTRADOR
      summary: Confirma MFA con TOTP
      responses:
        "200":
          $ref: "#/components/responses/Exito"
        "422":
          $ref: "#/components/responses/Error"
      operationId: postAuthMfaConfirmar
  /auth/mfa/deshabilitar:
    post:
      tags:
        - Autenticación
      x-roles:
        - ADMINISTRADOR
      summary: Deshabilita MFA con contraseña y TOTP
      responses:
        "204":
          description: MFA deshabilitado
        "422":
          $ref: "#/components/responses/Error"
      operationId: postAuthMfaDeshabilitar
  /usuarios:
    get:
      tags:
        - Usuarios
      x-roles:
        - ADMINISTRADOR
      summary: Lista usuarios
      responses:
        "200":
          $ref: "#/components/responses/Pagina"
        4XX:
          $ref: "#/components/responses/Error"
      operationId: getUsuarios
    post:
      tags:
        - Usuarios
      x-roles:
        - ADMINISTRADOR
      summary: Crea usuario con contraseña temporal y cambio obligatorio
      responses:
        "201":
          $ref: "#/components/responses/Exito"
        "409":
          $ref: "#/components/responses/Error"
      operationId: postUsuarios
  /usuarios/{id}:
    patch:
      tags:
        - Usuarios
      x-roles:
        - ADMINISTRADOR
      summary: Edita rol/estado sin permitir eliminar al último administrador
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Exito"
        "422":
          $ref: "#/components/responses/Error"
      operationId: patchUsuariosId
  /usuarios/{id}/restablecer-contrasena:
    post:
      tags:
        - Usuarios
      x-roles:
        - ADMINISTRADOR
      summary: Asigna contraseña temporal, revoca sesiones y fuerza su cambio
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Restablecida
        "422":
          $ref: "#/components/responses/Error"
      operationId: postUsuariosIdRestablecerContrasena
  /clientes:
    get:
      tags:
        - Clientes
      x-roles:
        - ADMINISTRADOR
        - CONTABLE
        - VENDEDOR
        - COBRADOR
      summary: Lista/busca clientes dentro del alcance
      parameters:
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/Limite"
        - $ref: "#/components/parameters/Buscar"
      responses:
        "200":
          $ref: "#/components/responses/Pagina"
        4XX:
          $ref: "#/components/responses/Error"
      operationId: getClientes
    post:
      tags:
        - Clientes
      x-roles:
        - ADMINISTRADOR
        - CONTABLE
        - VENDEDOR
      summary: Crea cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteEntrada"
      responses:
        "201":
          $ref: "#/components/responses/Exito"
        "409":
          $ref: "#/components/responses/Error"
      operationId: postClientes
  /clientes/{id}:
    get:
      tags:
        - Clientes
      x-roles:
        - ADMINISTRADOR
        - CONTABLE
        - VENDEDOR
        - COBRADOR
      summary: Expediente completo según alcance
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Exito"
        "404":
          $ref: "#/components/responses/Error"
      operationId: getClientesId
    patch:
      tags:
        - Clientes
      x-roles:
        - ADMINISTRADOR
        - CONTABLE
        - VENDEDOR
      summary: Edita contacto/localidad y campos permitidos
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Exito"
        "422":
          $ref: "#/components/responses/Error"
      operationId: patchClientesId
  /clientes/{id}/tarjeta:
    patch:
      tags:
        - Clientes
      x-roles:
        - ADMINISTRADOR
        - CONTABLE
        - VENDEDOR
      summary: Asigna tarjeta manual a cliente con saldo
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Exito"
        "422":
          $ref: "#/components/responses/Error"
      operationId: patchClientesIdTarjeta
  /clientes/{id}/saldo:
    patch:
      tags:
        - Clientes
      x-roles:
        - ADMINISTRADOR
        - CONTABLE
      summary: Ajusta saldo con valor esperado, motivo y contraseña
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Exito"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
      operationId: patchClientesIdSaldo
  /clientes/{id}/estado-cuenta:
    get:
      tags:
        - Clientes
      x-roles:
        - ADMINISTRADOR
        - CONTABLE
        - VENDEDOR
        - COBRADOR
      summary: Descarga/consulta estado de cuenta
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Estado de cuenta
        4XX:
          $ref: "#/components/responses/Error"
      operationId: getClientesIdEstadoCuenta
  /localidades:
    get:
      tags:
        - Localidades
      x-roles:
        - ADMINISTRADOR
        - CONTABLE
        - VENDEDOR
        - COBRADOR
      summary: Lista localidades
      responses:
        "200":
          $ref: "#/components/responses/Pagina"
        4XX:
          $ref: "#/components/responses/Error"
      operationId: getLocalidades
    post:
      tags:
        - Localidades
      x-roles:
        - ADMINISTRADOR
      summary: Crea localidad
      responses:
        "201":
          $ref: "#/components/responses/Exito"
        4XX:
          $ref: "#/components/responses/Error"
      operationId: postLocalidades
  /localidades/{id}:
    patch:
      tags:
        - Localidades
      x-roles:
        - ADMINISTRADOR
      summary: Edita localidad
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Exito"
        4XX:
          $ref: "#/components/responses/Error"
      operationId: patchLocalidadesId
  /rutas:
    get:
      tags:
        - Rutas
      x-roles:
        - ADMINISTRADOR
        - COBRADOR
      summary: Lista rutas permitidas
      responses:
        "200":
          $ref: "#/components/responses/Pagina"
        4XX:
          $ref: "#/components/responses/Error"
      operationId: getRutas
    post:
      tags:
        - Rutas
      x-roles:
        - ADMINISTRADOR
      summary: Crea ruta multilocalidad, con cobrador móvil opcional
      responses:
        "201":
          $ref: "#/components/responses/Exito"
        4XX:
          $ref: "#/components/responses/Error"
      operationId: postRutas
  /rutas/{id}:
    patch:
      tags:
        - Rutas
      x-roles:
        - ADMINISTRADOR
      summary: Reconfigura ruta/asignaciones
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Exito"
        4XX:
          $ref: "#/components/responses/Error"
      operationId: patchRutasId
  /rutas/clientes-con-saldo:
    get:
      tags:
        - Rutas
      x-roles:
        - ADMINISTRADOR
      summary: Lista clientas activas con saldo disponibles para asignar y ordenar
      responses:
        "200":
          $ref: "#/components/responses/Exito"
        4XX:
          $ref: "#/components/responses/Error"
      operationId: getRutasClientesConSaldo
  /rutas/{id}/visitas:
    post:
      tags:
        - Rutas
      x-roles:
        - ADMINISTRADOR
        - COBRADOR
      summary: Registra visita en línea
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          $ref: "#/components/responses/Exito"
        4XX:
          $ref: "#/components/responses/Error"
      operationId: postRutasIdVisitas
  /rutas/directorio-cobranza:
    get:
      tags:
        - Rutas
      x-roles:
        - COBRADOR
      summary: Directorio offline limitado al cobrador
      responses:
        "200":
          $ref: "#/components/responses/Exito"
        4XX:
          $ref: "#/components/responses/Error"
      operationId: getRutasDirectorioCobranza
  /rutas/{id}/clientes-extraordinarios:
    get:
      tags:
        - Rutas
      x-roles:
        - COBRADOR
      summary: Busca clientas de otra ruta del mismo cobrador
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Buscar"
      responses:
        "200":
          $ref: "#/components/responses/Pagina"
        4XX:
          $ref: "#/components/responses/Error"
      operationId: getRutasIdClientesExtraordinarios
  /rutas/{id}/jornada:
    get:
      tags:
        - Rutas
      x-roles:
        - ADMINISTRADOR
        - COBRADOR
      summary: Descarga jornada para trabajo offline
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Exito"
        4XX:
          $ref: "#/components/responses/Error"
      operationId: getRutasIdJornada
  /rutas/{id}/hoja.pdf:
    get:
      tags:
        - Rutas
      x-roles:
        - ADMINISTRADOR
        - COBRADOR
      summary: Hoja imprimible con orden exacto y monto a cobrar por cliente
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Fecha"
      responses:
        "200":
          description: PDF de la hoja de cobranza
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        4XX:
          $ref: "#/components/responses/Error"
      operationId: getRutasIdHoja.pdf
  /rutas/{id}/resultado.pdf:
    get:
      tags:
        - Rutas
      x-roles:
        - ADMINISTRADOR
        - COBRADOR
      summary: Reporte PDF con cobros, diferencias y compromisos de la jornada
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Fecha"
      responses:
        "200":
          description: PDF de resultados de cobranza
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        4XX:
          $ref: "#/components/responses/Error"
      operationId: getRutasIdResultado.pdf
  /rutas/{id}/historial:
    get:
      tags:
        - Rutas
      x-roles:
        - ADMINISTRADOR
        - COBRADOR
      summary: Historial de visitas/abonos
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Pagina"
        4XX:
          $ref: "#/components/responses/Error"
      operationId: getRutasIdHistorial
  /ventas:
    get:
      tags:
        - Ventas
      x-roles:
        - ADMINISTRADOR
        - CONTABLE
        - VENDEDOR
        - COBRADOR
      summary: Lista ventas dentro del alcance
      parameters:
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/Limite"
        - $ref: "#/components/parameters/Buscar"
      responses:
        "200":
          $ref: "#/components/responses/Pagina"
        4XX:
          $ref: "#/components/responses/Error"
      operationId: getVentas
    post:
      tags:
        - Ventas
      x-roles:
        - ADMINISTRADOR
        - VENDEDOR
        - COBRADOR
      summary: Confirma venta de contado o crédito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VentaEntrada"
      responses:
        "201":
          $ref: "#/components/responses/Exito"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
      operationId: postVentas
  /ventas/{id}:
    get:
      tags:
        - Ventas
      x-roles:
        - ADMINISTRADOR
        - CONTABLE
        - VENDEDOR
        - COBRADOR
      summary: Detalle histórico de venta
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Exito"
        4XX:
          $ref: "#/components/responses/Error"
      operationId: getVentasId
  /abonos:
    get:
      tags:
        - Abonos
      x-roles:
        - ADMINISTRADOR
        - CONTABLE
        - COBRADOR
      summary: Lista abonos permitidos
      parameters:
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/Limite"
      responses:
        "200":
          $ref: "#/components/responses/Pagina"
        4XX:
          $ref: "#/components/responses/Error"
      operationId: getAbonos
    post:
      tags:
        - Abonos
      x-roles:
        - ADMINISTRADOR
        - CONTABLE
        - COBRADOR
      summary: Aplica abono a saldo/cuotas/caja
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbonoEntrada"
      responses:
        "200":
          description: Reintento idempotente
        "201":
          $ref: "#/components/responses/Exito"
        "422":
          $ref: "#/components/responses/Error"
      operationId: postAbonos
  /abonos/agenda:
    get:
      tags:
        - Abonos
      x-roles:
        - ADMINISTRADOR
        - CONTABLE
        - COBRADOR
      summary: Resume qué cobrar hoy, esta semana y lo vencido
      responses:
        "200":
          description: Agenda de cuotas y cobros dentro del alcance del usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaCobranza"
        4XX:
          $ref: "#/components/responses/Error"
      operationId: getAbonosAgenda
  /abonos/riesgo/recalcular:
    post:
      tags:
        - Abonos
      x-roles:
        - ADMINISTRADOR
        - CONTABLE
      summary: Recalcula evaluación de riesgo
      responses:
        "200":
          $ref: "#/components/responses/Exito"
        4XX:
          $ref: "#/components/responses/Error"
      operationId: postAbonosRiesgoRecalcular
  /abonos/{id}/anular:
    post:
      tags:
        - Abonos
      x-roles:
        - ADMINISTRADOR
        - CONTABLE
      summary: Compensa un abono sin borrarlo
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Exito"
        "409":
          $ref: "#/components/responses/Error"
      operationId: postAbonosIdAnular
  /inventario/productos:
    get:
      tags:
        - Inventario
      x-roles:
        - ADMINISTRADOR
        - ALMACENISTA
        - VENDEDOR
        - COBRADOR
      summary: Lista productos; oculta costos por rol
      parameters:
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/Limite"
        - $ref: "#/components/parameters/Buscar"
        - name: categoriaId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          $ref: "#/components/responses/Pagina"
        4XX:
          $ref: "#/components/responses/Error"
      operationId: getInventarioProductos
    post:
      tags:
        - Inventario
      x-roles:
        - ADMINISTRADOR
        - ALMACENISTA
      summary: Crea producto, existencia y foto opcional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoEntrada"
      responses:
        "201":
          $ref: "#/components/responses/Exito"
        "422":
          $ref: "#/components/responses/Error"
      operationId: postInventarioProductos
  /inventario/catalogos-producto:
    get:
      tags:
        - Inventario
      x-roles:
        - ADMINISTRADOR
        - ALMACENISTA
        - VENDEDOR
        - COBRADOR
      summary: Lista marcas y categorías activas para reutilizarlas al capturar
      responses:
        "200":
          description: Catálogos activos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogosProducto"
        4XX:
          $ref: "#/components/responses/Error"
      operationId: getInventarioCatalogosProducto
  /inventario/categorias-producto:
    post:
      tags:
        - Inventario
      x-roles:
        - ADMINISTRADOR
        - ALMACENISTA
      summary: Agrega o reactiva una agrupación del catálogo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombre
              properties:
                nombre:
                  type: string
                  minLength: 2
                  maxLength: 100
      responses:
        "200":
          $ref: "#/components/responses/Exito"
        "201":
          $ref: "#/components/responses/Exito"
        4XX:
          $ref: "#/components/responses/Error"
      operationId: postInventarioCategoriasProducto
  /inventario/productos/codigo/{codigo}:
    get:
      tags:
        - Inventario
      x-roles:
        - ADMINISTRADOR
        - ALMACENISTA
        - VENDEDOR
        - COBRADOR
      summary: Busca por código de barras/QR/SKU
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Exito"
        "404":
          $ref: "#/components/responses/Error"
      operationId: getInventarioProductosCodigoCodigo
  /inventario/productos/{id}:
    patch:
      tags:
        - Inventario
      x-roles:
        - ADMINISTRADOR
        - ALMACENISTA
      summary: Edita catálogo/foto
      parameters:
        - $ref: "#/components/parameters/Id"
