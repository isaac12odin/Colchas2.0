components:
  securitySchemes:
    cookieSesion:
      type: apiKey
      in: cookie
      name: access_token
    bearerMovil:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Pagina:
      name: pagina
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limite:
      name: limite
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Buscar:
      name: buscar
      in: query
      schema:
        type: string
        maxLength: 180
    Fecha:
      name: fecha
      in: query
      required: true
      schema:
        type: string
        format: date
  responses:
    Exito:
      description: Operación correcta
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Pagina:
      description: Página correcta
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Pagina"
    Error:
      description: Error estable de aplicación
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    DineroNoNegativo:
      type: number
      minimum: 0
      maximum: 9999999999.99
      multipleOf: 0.01
    DineroPositivo:
      type: number
      exclusiveMinimum: 0
      maximum: 9999999999.99
      multipleOf: 0.01
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - codigo
            - mensaje
          properties:
            codigo:
              type: string
            mensaje:
              type: string
            detalles: {}
    Pagina:
      type: object
      required:
        - datos
        - total
        - pagina
        - limite
      properties:
        datos:
          type: array
          items: {}
        total:
          type: integer
        pagina:
          type: integer
        limite:
          type: integer
        paginas:
          type: integer
    InicioSesion:
      type: object
      required:
        - correo
        - contrasena
      properties:
        correo:
          type: string
          format: email
        contrasena:
          type: string
        cliente:
          type: string
          enum:
            - WEB
            - MOVIL
          default: WEB
        codigoMfa:
          type: string
          pattern: ^\d{6}$
    ClienteEntrada:
      type: object
      required:
        - nombreCompleto
        - telefono
        - direccion
        - localidadId
      properties:
        nombreCompleto:
          type: string
          minLength: 3
        telefono:
          type: string
          minLength: 7
        direccion:
          type: string
          minLength: 5
        localidadId:
          type: string
          format: uuid
        limiteCredito:
          $ref: "#/components/schemas/DineroNoNegativo"
        notas:
          type: string
    PlanPago:
      type: object
      required:
        - periodicidad
        - montoCuota
        - primerVencimiento
      properties:
        periodicidad:
          type: string
          enum:
            - SEMANAL
            - QUINCENAL
            - MENSUAL
        montoCuota:
          $ref: "#/components/schemas/DineroPositivo"
        primerVencimiento:
          type: string
          format: date-time
          description: Igual o posterior a fechaVenta/fechaEntrega
    VentaEntrada:
      type: object
      required:
        - tipo
        - items
      properties:
        clienteId:
          type:
            - string
            - "null"
          format: uuid
        numeroTarjeta:
          type: string
        tipo:
          type: string
          enum:
            - CONTADO
            - CREDITO
            - PUBLICO
        descuento:
          $ref: "#/components/schemas/DineroNoNegativo"
        anticipo:
          $ref: "#/components/schemas/DineroNoNegativo"
        metodoAnticipo:
          type: string
          enum:
            - EFECTIVO
            - TRANSFERENCIA
            - TARJETA
            - OTRO
        fechaVenta:
          type: string
          format: date-time
          description: Máximo 36h atrás y 10m adelante
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - productoId
              - cantidad
            properties:
              productoId:
                type: string
                format: uuid
              cantidad:
                type: integer
                minimum: 1
              precioUnitario:
                $ref: "#/components/schemas/DineroPositivo"
        plan:
          $ref: "#/components/schemas/PlanPago"
    AbonoEntrada:
      type: object
      required:
        - clienteId
        - monto
      properties:
        clienteId:
          type: string
          format: uuid
        ventaId:
          type:
            - string
            - "null"
          format: uuid
        monto:
          $ref: "#/components/schemas/DineroPositivo"
        metodo:
          type: string
          enum:
            - EFECTIVO
            - TRANSFERENCIA
            - TARJETA
            - OTRO
        fechaAbono:
          type: string
          format: date-time
          description: Máximo 36h atrás y 10m adelante
        referencia:
          type: string
        idOperacionMovil:
          type: string
    ResumenAgendaCobranza:
      type: object
      required:
        - cantidad
        - cuotas
        - total
      properties:
        cantidad:
          type: integer
          minimum: 0
          description: Clientas distintas
        cuotas:
          type: integer
          minimum: 0
          description: Abonos programados
        total:
          type: number
          minimum: 0
    ResumenCobrado:
      type: object
      required:
        - cantidad
        - total
      properties:
        cantidad:
          type: integer
          minimum: 0
        total:
          type: number
          minimum: 0
    AgendaCobranza:
      type: object
      required:
        - hoy
        - semana
        - vencidos
        - cobrado
      properties:
        hoy:
          allOf:
            - $ref: "#/components/schemas/ResumenAgendaCobranza"
            - type: object
              required:
                - fecha
              properties:
                fecha:
                  type: string
                  format: date
                items:
                  type: array
                  items: {}
        semana:
          allOf:
            - $ref: "#/components/schemas/ResumenAgendaCobranza"
            - type: object
              required:
                - inicio
                - fin
                - dias
              properties:
                inicio:
                  type: string
                  format: date
                fin:
                  type: string
                  format: date
                dias:
                  type: array
                  items:
                    allOf:
                      - $ref: "#/components/schemas/ResumenAgendaCobranza"
                      - type: object
                        properties:
                          fecha:
                            type: string
                            format: date
        vencidos:
          $ref: "#/components/schemas/ResumenAgendaCobranza"
        cobrado:
          type: object
          required:
            - hoy
            - semana
          properties:
            hoy:
              $ref: "#/components/schemas/ResumenCobrado"
            semana:
              $ref: "#/components/schemas/ResumenCobrado"
    CategoriaProducto:
      type: object
      required:
        - id
        - nombre
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
    CatalogosProducto:
      type: object
      required:
        - marcas
        - categorias
      properties:
        marcas:
          type: array
          items:
            type: string
        categorias:
          type: array
          items:
            $ref: "#/components/schemas/CategoriaProducto"
    ProductoEntrada:
      type: object
      required:
        - sku
        - nombre
        - marca
        - categoriaId
        - existenciaMinima
        - precioVenta
        - precioCompra
      properties:
        sku:
          type: string
          minLength: 2
          maxLength: 60
        nombre:
          type: string
          minLength: 2
          maxLength: 180
        marca:
          type: string
          minLength: 1
          maxLength: 120
        categoriaId:
          type: string
          format: uuid
        codigoBarras:
          type:
            - string
            - "null"
        codigoQr:
          type:
            - string
            - "null"
        existenciaInicial:
          type: integer
          minimum: 0
        existenciaMinima:
          type: integer
          minimum: 0
        precioVenta:
          $ref: "#/components/schemas/DineroPositivo"
        precioCompra:
          $ref: "#/components/schemas/DineroNoNegativo"
        foto:
          type: object
          description: Imagen base64 procesada y almacenada como archivo WebP; PostgreSQL conserva sólo la ruta.
    OperacionOffline:
      type: object
      required:
        - idOperacion
        - tipo
        - secuencia
        - hashAnterior
        - creadoEn
        - hashIntegridad
        - datos
      properties:
        idOperacion:
          type: string
        tipo:
          type: string
          enum:
            - VISITA
            - ABONO
            - VENTA
            - ENTREGA
        secuencia:
          type: integer
          minimum: 1
        hashAnterior:
          type: string
        creadoEn:
          type: string
          format: date-time
        hashIntegridad:
          type: string
          pattern: ^[a-fA-F0-9]{128}$
        datos:
          type: object
    LoteOffline:
      type: object
      required:
        - idLoteCliente
        - dispositivoId
        - huellaIntegridad
        - operaciones
      properties:
        idLoteCliente:
          type: string
        dispositivoId:
          type: string
        huellaIntegridad:
          type: string
          pattern: ^[a-fA-F0-9]{128}$
        operaciones:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/OperacionOffline"
