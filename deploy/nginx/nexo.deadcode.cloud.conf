# Fuente de verdad del proxy utilizado en Hostinger.
# Copiar a /etc/nginx/sites-available/nexo.deadcode.cloud y habilitar con symlink.
server {
  listen 80;
  listen [::]:80;
  server_name nexo.deadcode.cloud;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name nexo.deadcode.cloud;
  server_tokens off;

  ssl_certificate /etc/letsencrypt/live/nexo.deadcode.cloud/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nexo.deadcode.cloud/privkey.pem;

  client_max_body_size 12m;

  location = /descargas/vektra.apk {
    alias /var/www/nexo-downloads/Vektra-1.0.0-r3.apk;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="Vektra-Android.apk"' always;
    add_header Cache-Control "private, no-store, max-age=0" always;
    include /etc/nginx/snippets/nexo-seguridad.conf;
  }

  location = /salud {
    proxy_pass http://127.0.0.1:4100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, max-age=0" always;
    include /etc/nginx/snippets/nexo-seguridad.conf;
  }

  location = /salud/listo {
    proxy_pass http://127.0.0.1:4100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, max-age=0" always;
    include /etc/nginx/snippets/nexo-seguridad.conf;
  }

  # El navegador usa /api/*; Express publica esos contratos bajo /api/v1/*.
  location ^~ /api/ {
    rewrite ^/api/(.*)$ /api/v1/$1 break;
    proxy_pass http://127.0.0.1:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_buffering off;
    include /etc/nginx/snippets/nexo-seguridad.conf;
  }

  location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/nexo-seguridad.conf;
  }

  # HTML y datos RSC nunca anuncian caché anual; cada despliegue se ve de inmediato.
  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, max-age=0" always;
    include /etc/nginx/snippets/nexo-seguridad.conf;
  }
}
