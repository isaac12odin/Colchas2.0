name: Smoke producción

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dominio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/verificar-dominio-produccion.mjs
        env:
          NEXO_PRODUCTION_URL: https://nexo.deadcode.cloud
